[package]
name = "adar"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Collection of architectural tools including flags, state machine, enum and tuple operations."
keywords = ["architecture", "design", "flag", "statemachine", "tuple"]
repository = "https://github.com/nandee95/adar/tree/main/adar"
documentation = "https://docs.rs/adar"

[features]
default = ["std", "alloc", "serde"]
## Enable `std` support
std = []
## Enable `serde` support
serde = ["dep:serde"]
## Enable features using `alloc`
alloc = ["dep:async-trait"]
## Removes the Send restrictions from async trait implementations (For single threaded async runtimes)
async-st = ["adar-macros/async-st"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }
adar-macros = { version = "0.2.1" }
serde = { version = "1.0", default-features = false, optional = true }
async-trait = { version = "0.1.89", optional = true }

[dev-dependencies]
once_cell = "1.21.3"
serde_json = { version = "1.0" }
serial_test = "3.5.0"
tokio = { version = "1.52.3", features = [
    "test-util",
    "macros",
    "rt-multi-thread",
] }
