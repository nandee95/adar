[package]
name = "adar-macros"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "This crate contains the macros for the 'adar' crate."
repository = "https://github.com/nandee95/adar/tree/main/adar_macros"
documentation = "https://docs.rs/adar-macros"

[features]
## Removes the Send restrictions from async trait implementations (For single threaded async runtimes)
async-st = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
